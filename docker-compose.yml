services:
  # =============================================
  # FastAPI 业务服务（始终部署）
  # =============================================
  fastapi:
    build: .
    container_name: fastapi-app
    ports:
      - "8888:8888"
    env_file:
      - .env
    environment:
      - LANGGRAPH_API_URL=${LANGGRAPH_API_URL:-http://langgraph:8000}
      - MYSQL_URL=mysql+aiomysql://${MYSQL_USER:-root}:${MYSQL_PASSWORD:-root}@${MYSQL_HOST:-mysql}:${MYSQL_PORT:-3306}/${MYSQL_DATABASE:-app_db}
      - MILVUS_URI=http://${MILVUS_HOST:-milvus}:${MILVUS_PORT:-19530}
      - POSTGRES_URI=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@${POSTGRES_HOST:-postgres}:${POSTGRES_PORT:-5432}/${POSTGRES_DB:-langgraph}
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      postgres:
        condition: service_healthy
    volumes:
      # 与 kb-ingest-worker 共享解析产物 static/parsed_md/，否则 worker 读不到中间 Markdown
      - app_static:/app/static
    networks:
      - app-network

  # =============================================
  # 索引入库 worker：与 fastapi 共用同一镜像（build: .），仅启动命令不同（python -m rag.worker.kb_ingest）。
  # 拆成独立服务便于单独启停、扩容、与 HTTP 进程隔离；需 Redis 时与 redis 同档启用。
  # =============================================
  kb-ingest-worker:
    build: .
    container_name: kb-ingest-worker
    profiles:
      - redis
    env_file:
      - .env
    environment:
      - PYTHONUNBUFFERED=1
      - MYSQL_URL=mysql+aiomysql://${MYSQL_USER:-root}:${MYSQL_PASSWORD:-root}@${MYSQL_HOST:-mysql}:${MYSQL_PORT:-3306}/${MYSQL_DATABASE:-app_db}
      - MILVUS_URI=http://${MILVUS_HOST:-milvus}:${MILVUS_PORT:-19530}
      - REDIS_URI=redis://redis:6379/0
    command: python -m rag.worker.kb_ingest
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - app_static:/app/static
    restart: unless-stopped
    networks:
      - app-network

  # =============================================
  # LangGraph Platform 服务（始终部署）
  # 使用镜像 langgraph-agent:latest（本地需先 langgraph build）
  # =============================================
  langgraph:
    image: langgraph-agent:latest
    container_name: langgraph-server
    ports:
      - "8123:8000"
    env_file:
      - .env
    environment:
      - MILVUS_URI=http://${MILVUS_HOST:-milvus}:${MILVUS_PORT:-19530}
      - MILVUS_COLLECTION=${MILVUS_COLLECTION:-MILVUS_COLLECTION}
      - MILVUS_DIM=${MILVUS_DIM:-1024}
      - POSTGRES_URI=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@${POSTGRES_HOST:-postgres}:${POSTGRES_PORT:-5432}/${POSTGRES_DB:-langgraph}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/ok')"]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    networks:
      - app-network

  # =============================================
  # PostgreSQL — LangGraph Checkpointer（可选，支持第三方）
  # 使用第三方时：修改 .env 中 POSTGRES_URI 即可
  # =============================================
  postgres:
    image: postgres:16-alpine
    container_name: langgraph-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-langgraph}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - app-network

  # =============================================
  # Redis — LangGraph Platform 依赖（可选，支持第三方）
  # 使用第三方时：修改 .env 中 REDIS_URI 即可
  # =============================================
  redis:
    image: redis:7-alpine
    container_name: langgraph-redis
    profiles:
      - redis
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - app-network

  # =============================================
  # MySQL — 业务数据库（可选，支持第三方）
  # 使用第三方时：修改 .env 中 MYSQL_HOST 等变量即可
  # =============================================
  mysql:
    image: mysql:8.0
    container_name: app-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_PASSWORD:-root}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-app_db}
    ports:
      - "3306:3306"
    volumes:
      - mysqldata:/var/lib/mysql
    command: --default-authentication-plugin=mysql_native_password --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - app-network

  # =============================================
  # Milvus — 向量数据库（可选，支持第三方）
  # 使用第三方时：修改 .env 中 MILVUS_HOST 等变量即可
  # =============================================
  etcd:
    image: quay.io/coreos/etcd:v3.5.18
    container_name: milvus-etcd
    profiles:
      - milvus
    environment:
      - ETCD_AUTO_COMPACTION_MODE=revision
      - ETCD_AUTO_COMPACTION_RETENTION=1000
      - ETCD_QUOTA_BACKEND_BYTES=4294967296
      - ETCD_SNAPSHOT_COUNT=50000
    volumes:
      - etcddata:/etcd
    command: etcd -advertise-client-urls=http://127.0.0.1:2379 -listen-client-urls http://0.0.0.0:2379 --data-dir /etcd
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 30s
      timeout: 20s
      retries: 3
    restart: unless-stopped
    networks:
      - app-network

  minio:
    image: minio/minio:RELEASE.2023-03-20T20-16-18Z
    container_name: milvus-minio
    profiles:
      - milvus
    environment:
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
    ports:
      - "9001:9001"
      - "9000:9000"
    volumes:
      - miniodata:/minio_data
    command: minio server /minio_data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
    restart: unless-stopped
    networks:
      - app-network

  milvus:
    image: milvusdb/milvus:v2.4.17
    container_name: milvus-standalone
    profiles:
      - milvus
    command: milvus run standalone
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
    ports:
      - "19530:19530"
      - "9091:9091"
    volumes:
      - milvusdata:/var/lib/milvus
    depends_on:
      etcd:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 30s
      timeout: 20s
      retries: 3
    restart: unless-stopped
    networks:
      - app-network

volumes:
  app_static:
  pgdata:
  redisdata:
  mysqldata:
  etcddata:
  miniodata:
  milvusdata:

networks:
  app-network:
    driver: bridge
