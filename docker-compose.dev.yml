version: '3.9'

services:
  # =============================================
  # FastAPI 业务服务（支持热更新）
  # =============================================
  fastapi:
    build:
      context: .
      dockerfile: Dockerfile.fastapi
    container_name: fastapi-app-dev
    ports:
      - "8888:8888"
    env_file:
      - .env
    environment:
      - LANGGRAPH_API_URL=http://langgraph:8000
      - MYSQL_URL=mysql+aiomysql://${MYSQL_USER:-root}:${MYSQL_PASSWORD:-root}@${MYSQL_HOST:-mysql}:${MYSQL_PORT:-3306}/${MYSQL_DATABASE:-app_db}
      - MILVUS_URI=http://${MILVUS_HOST:-milvus}:${MILVUS_PORT:-19530}
      - REDIS_URI=redis://redis:6379/1
      - POSTGRES_URI=postgresql://postgres:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-langgraph}
      - WATCHFILES_FORCE_POLLING=true
    volumes:
      - ./src:/app/src
      - ./configs:/app/configs
      - ./static:/app/static
    command: uvicorn services.main_app:app --host 0.0.0.0 --port 8888 --reload --reload-dir /app/src --reload-dir /app/configs
    depends_on:
      mysql:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      milvus:
        condition: service_healthy
    networks:
      - app-network

  # =============================================
  # LlamaRAG 解析 Worker（Taskiq，队列 llamarag:parse）
  # =============================================
  llamarag-parse-worker:
    build:
      context: .
      dockerfile: Dockerfile.fastapi
    container_name: llamarag-parse-worker-dev
    env_file:
      - .env
    environment:
      - PYTHONUNBUFFERED=1
      - MYSQL_URL=mysql+aiomysql://${MYSQL_USER:-root}:${MYSQL_PASSWORD:-root}@${MYSQL_HOST:-mysql}:${MYSQL_PORT:-3306}/${MYSQL_DATABASE:-app_db}
      # 与 FastAPI 一致；勿仅用 .env 的 localhost，否则容器内会连自身 19530，MilvusVectorStore 长时间阻塞，队列一直 queued
      - MILVUS_URI=http://${MILVUS_HOST:-milvus}:${MILVUS_PORT:-19530}
      # LlamaIndex docstore；表在 schema llamaindex，可与 POSTGRES_DB 同一库不同 schema（勿填 localhost）
      - LLAMAINDEX_POSTGRES_URI=postgresql://postgres:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-langgraph}
      - REDIS_URI=redis://redis:6379/1
    volumes:
      - ./src:/app/src
      - ./configs:/app/configs
      - ./static:/app/static
    command: taskiq worker llamarag.worker.taskiq_tasks:broker
    depends_on:
      mysql:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      milvus:
        condition: service_healthy
    networks:
      - app-network

  # =============================================
  # LangGraph 服务（使用自定义 Dockerfile.langgraph）
  # =============================================
  langgraph:
    build:
      context: .
      dockerfile: Dockerfile.langgraph
    container_name: langgraph-server-dev
    ports:
      - "8123:8000"
    env_file:
      - .env
    environment:
      - POSTGRES_URI=postgresql://postgres:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-langgraph}
      - REDIS_URI=redis://redis:6379/0
      - MILVUS_URI=http://${MILVUS_HOST:-milvus}:${MILVUS_PORT:-19530}
      - MILVUS_COLLECTION=${MILVUS_COLLECTION:-MILVUS_COLLECTION}
      - MILVUS_DIM=${MILVUS_DIM:-1024}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/ok')"]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 30s
    volumes:
      - ./src:/app/src
      - ./configs:/app/configs
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      milvus:
        condition: service_healthy
    networks:
      - app-network

  # =============================================
  # PostgreSQL
  # =============================================
  postgres:
    image: postgres:16-alpine
    container_name: langgraph-postgres-dev
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-langgraph}
    ports:
      - "5432:5432"
    volumes:
      - pgdata_dev:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - app-network

  # =============================================
  # Redis
  # =============================================
  redis:
    image: redis:7-alpine
    container_name: langgraph-redis-dev
    ports:
      - "6379:6379"
    volumes:
      - redisdata_dev:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - app-network

  # =============================================
  # MySQL
  # =============================================
  mysql:
    image: mysql:8.0
    container_name: app-mysql-dev
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_PASSWORD:-root}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-app_db}
    ports:
      - "3306:3306"
    volumes:
      - mysqldata_dev:/var/lib/mysql
    command: --default-authentication-plugin=mysql_native_password --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app-network

  # =============================================
  # Milvus 相关服务
  # =============================================
  etcd:
    image: quay.io/coreos/etcd:v3.5.18
    container_name: milvus-etcd-dev
    environment:
      - ETCD_AUTO_COMPACTION_MODE=revision
      - ETCD_AUTO_COMPACTION_RETENTION=1000
      - ETCD_QUOTA_BACKEND_BYTES=4294967296
      - ETCD_SNAPSHOT_COUNT=50000
    volumes:
      - etcddata_dev:/etcd
    command: etcd -advertise-client-urls=http://127.0.0.1:2379 -listen-client-urls http://0.0.0.0:2379 --data-dir /etcd
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 30s
      timeout: 20s
      retries: 3
    networks:
      - app-network

  minio:
    image: minio/minio:RELEASE.2023-03-20T20-16-18Z
    container_name: milvus-minio-dev
    environment:
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
    ports:
      - "9001:9001"
      - "9000:9000"
    volumes:
      - miniodata_dev:/minio_data
    command: minio server /minio_data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
    networks:
      - app-network

  # 升级前请备份 milvusdata_dev；2.4→2.5 见 https://milvus.io/docs/upgrade_milvus.md
  milvus:
    image: milvusdb/milvus:v2.5.27
    container_name: milvus-standalone-dev
    command: milvus run standalone
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
    ports:
      - "19530:19530"
      - "9091:9091"
    volumes:
      - milvusdata_dev:/var/lib/milvus
    depends_on:
      etcd:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 30s
      timeout: 20s
      retries: 3
    networks:
      - app-network

  # =============================================
  # Attu（Milvus 可视化管理；）
  # =============================================
  attu:
    image: zilliz/attu:v2.5.12
    container_name: milvus-attu-dev
    ports:
      - "8000:3000"
    environment:
      MILVUS_URL: milvus:19530
    depends_on:
      milvus:
        condition: service_healthy
    networks:
      - app-network

volumes:
  pgdata_dev:
  redisdata_dev:
  mysqldata_dev:
  etcddata_dev:
  miniodata_dev:
  milvusdata_dev:

networks:
  app-network:
    driver: bridge