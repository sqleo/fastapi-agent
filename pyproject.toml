[project]
name = "agent"
version = "0.0.1"
description = "Starter template for making a new agent LangGraph."
authors = [
    { name = "William Fu-Hinthorn", email = "13333726+hinthornw@users.noreply.github.com" },
]
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.135.1",
    "python-multipart>=0.0.9",
    "langchain>=1.2.13",
    "langchain-openai>=0.3.0",
    "langchain-milvus>=0.3.3",
    "langgraph>=1.0.0",
    "langgraph-cli[inmem]>=0.4.14",
    "langgraph-sdk>=0.1.0",
    "python-dotenv>=1.0.1",
    "sqlalchemy>=2.0.48",
    "sqlmodel>=0.0.37",
    "aiomysql>=0.2.0",
    "greenlet>=3.0.0",
    "uvicorn>=0.34.0",
    "pydantic-settings>=2.13.1",
    "bcrypt>=4.2.0",
    "email-validator>=2.0.0",
    "PyJWT>=2.9.0",
]


[project.optional-dependencies]
dev = ["mypy>=1.11.1", "ruff>=0.6.1"]

[build-system]
requires = ["setuptools>=73.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = [
    "langgraph.templates.agent",
    "agent",
    "schemas",
    "services",
    "shared",
    "prompts",
    "utils",
    "models",
]
[tool.setuptools.package-dir]
"langgraph.templates.agent" = "src/agent"
"agent" = "src/agent"
"schemas" = "src/schemas"
"services" = "src/services"
"shared" = "src/shared"
"prompts" = "src/prompts"
"utils" = "src/utils"
"models" = "src/models"
[tool.setuptools.package-data]
"*" = ["py.typed"]

[tool.ruff]
lint.select = [
    "E",    # pycodestyle
    "F",    # pyflakes
    "I",    # isort
    "D",    # pydocstyle
    "D401", # First line should be in imperative mood
    "T201",
    "UP",
]
lint.ignore = [
    "UP006",
    "UP007",
    # We actually do want to import from typing_extensions
    "UP035",
    # Relax the convention by _not_ requiring documentation for every function parameter.
    "D417",
    "E501",
]
[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D", "UP"]
# 模块/函数说明使用中文，首行不以英文句点结尾
"src/schemas/**/*.py" = ["D415"]
"src/services/**/*.py" = ["D415"]
"src/utils/**/*.py" = ["D415"]
"src/utils/llm_init.py" = ["D100"]
"configs/**/*.py" = ["D415"]
[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.pytest.ini_options]
pythonpath = [".", "src"]

[dependency-groups]
dev = [
    "anyio>=4.7.0",
    "langgraph-cli[inmem]>=0.4.14",
    "mypy>=1.13.0",
    "pytest>=8.3.5",
    "ruff>=0.8.2",
]
