[project]
name = "agent"
version = "0.0.1"
description = "Starter template for making a new agent LangGraph."
authors = [
    { name = "Chu Jiu", email = "13333726+hinthornw@users.noreply.github.com" },
]
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.135.1",
    "python-multipart>=0.0.9",
    "langchain>=1.2.13",
    "langchain-openai>=0.3.0",
    "langchain-deepseek>=0.1.0",
    "httpx>=0.27.0",
    "langgraph>=1.0.0",
    "langgraph-cli[inmem]>=0.4.14",
    "langgraph-sdk>=0.1.0",
    "python-dotenv>=1.0.1",
    "sqlalchemy>=2.0.48",
    "sqlmodel>=0.0.37",
    "aiomysql>=0.2.0",
    "greenlet>=3.0.0",
    "uvicorn>=0.34.0",
    "pydantic-settings>=2.13.1",
    "bcrypt>=4.2.0",
    "email-validator>=2.0.0",
    "PyJWT>=2.9.0",
    "langmem>=0.0.30",
    "langgraph-checkpoint-postgres[aiopg]>=3.0.5",
    "psycopg[binary,pool]>=3.2",
    "redis>=5.0.0",
    "aiofiles>=24.1.0",
    "llama-index-core>=0.12.0",
    "llama-index-readers-file>=0.6.0",
    "llama-index-vector-stores-milvus>=0.4.0",
    "pymilvus>=2.5.0",
    "pyyaml>=6.0",
    "jinja2>=3.1.4",
    "llama-index-embeddings-huggingface>=0.7.0",
    "taskiq>=0.11.0",
    "taskiq-redis>=1.0.0",
    "llama-index-storage-docstore-postgres>=0.5.0",
    "llama-index-storage-index-store-postgres>=0.5.0",
    "transformers>=4.46.0",
]


[project.optional-dependencies]
dev = ["mypy>=1.11.1", "ruff>=0.6.1"]

[build-system]
requires = ["setuptools>=77.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = [
    "langgraph.templates.agent",
    "agent",
    "schemas",
    "services",
    "shared",
    "utils",
    "models",
    "monitor",
    "llamarag",
    "llamarag.create_node",
    "llamarag.ingestion",
    "llamarag.queue",
    "llamarag.worker",
]
[tool.setuptools.package-dir]
"langgraph.templates.agent" = "src/agent"
"agent" = "src/agent"
"schemas" = "src/schemas"
"services" = "src/services"
"shared" = "src/shared"
"utils" = "src/utils"
"models" = "src/models"
"monitor" = "src/monitor"
"llamarag" = "src/llamarag"
"llamarag.create_node" = "src/llamarag/create_node"
"llamarag.ingestion" = "src/llamarag/ingestion"
"llamarag.queue" = "src/llamarag/queue"
"llamarag.worker" = "src/llamarag/worker"
[tool.setuptools.package-data]
"*" = ["py.typed"]

[tool.ruff]
lint.select = [
    "E",    # pycodestyle
    "F",    # pyflakes
    "I",    # isort
    "D",    # pydocstyle
    "D401", # First line should be in imperative mood
    "T201",
    "UP",
]
lint.ignore = [
    "UP006",
    "UP007",
    # We actually do want to import from typing_extensions
    "UP035",
    # Relax the convention by _not_ requiring documentation for every function parameter.
    "D417",
    "E501",
]
[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D", "UP"]
# 模块/函数说明使用中文，首行不以英文句点结尾
"src/schemas/**/*.py" = ["D415"]
"src/services/**/*.py" = ["D415"]
"src/utils/**/*.py" = ["D415"]
"src/shared/embedding/http_openai.py" = ["D415"]
"src/llamarag/**/*.py" = ["D415"]
"src/agent/tools/**/*.py" = ["D415"]
"src/utils/llm_init.py" = ["D100"]
"src/agent/memory_turns.py" = ["D415", "D103"]
"src/agent/langmem_setup.py" = ["D415", "D103"]
"src/agent/context_window_middleware.py" = ["D415"]
"configs/**/*.py" = ["D415"]
"src/monitor/**/*.py" = ["D415"]
[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.pytest.ini_options]
pythonpath = [".", "src"]


[tool.basedpyright]
venvPath = "."
venv = ".venv"
extraPaths = ["src"]

[dependency-groups]
dev = [
    "anyio>=4.7.0",
    "langgraph-cli[inmem]>=0.4.14",
    "mypy>=1.13.0",
    "pytest>=8.3.5",
    "ruff>=0.8.2",
]
