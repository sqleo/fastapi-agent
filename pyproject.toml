[project]
name = "agent"
version = "0.0.1"
description = "Starter template for making a new agent LangGraph."
authors = [
    { name = "William Fu-Hinthorn", email = "13333726+hinthornw@users.noreply.github.com" },
]
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.135.1",
    "python-multipart>=0.0.9",
    "langchain>=1.2.13",
    "langchain-openai>=0.3.0",
    "langchain-milvus>=0.3.3",
    "langgraph>=1.0.0",
    "langgraph-cli[inmem]>=0.4.14",
    "langgraph-sdk>=0.1.0",
    "python-dotenv>=1.0.1",
    "sqlalchemy>=2.0.48",
    "sqlmodel>=0.0.37",
    "aiomysql>=0.2.0",
    "uvicorn>=0.34.0",
    "pydantic-settings>=2.13.1",
    "bcrypt>=4.2.0",
    "email-validator>=2.0.0",
    "PyJWT>=2.9.0",
    "unstructured>=0.18.32",
    "pdfminer.six>=20251230",
    "pi-heif>=1.2.0",
    "pypdf>=6.6.2",
    "pdf2image>=1.17.0",
    "unstructured-inference>=1.2.0",
    "langchain-community>=0.4.1",
    "langchain-mineru>=0.1.3",
    "opencv-python-headless>=4.13.0.90",
    "unstructured-pytesseract>=0.3.15",
]


[project.optional-dependencies]
dev = ["mypy>=1.11.1", "ruff>=0.6.1"]

# unstructured-inference 依赖 opencv-python（需 libGL）；解析时改为 headless，便于 slim 镜像与 uv/pip 只装一份 cv2
[tool.uv]
dependency-metadata = [
    { name = "unstructured-inference", version = "1.2.0", requires-dist = [
        "python-multipart",
        "huggingface-hub",
        "numpy",
        "opencv-python-headless>=4.13.0.90",
        "onnx",
        "onnxruntime>=1.18.0",
        "matplotlib",
        "torch",
        "timm",
        "transformers>=4.25.1",
        "accelerate",
        "rapidfuzz",
        "pandas",
        "scipy",
        "pypdfium2>=5.0.0",
        "pdfminer-six",
    ] },
    { name = "unstructured-inference", version = "1.5.2", requires-dist = [
        "accelerate>=1.12.0",
        "huggingface-hub>=1.4.1",
        "matplotlib>=3.10.8",
        "numpy>=2.4.2",
        "onnx>=1.20.1",
        "onnxruntime>=1.18.0",
        "opencv-python-headless>=4.13.0.90",
        "pandas>=3.0.0",
        "pypdfium2>=5.0.0",
        "rapidfuzz>=3.14.3",
        "scipy>=1.17.0",
        "timm>=1.0.24",
        "torch>=2.10.0",
        "transformers>=4.25.1",
    ] },
]

[build-system]
requires = ["setuptools>=73.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = [
    "langgraph.templates.agent",
    "agent",
    "ingestion",
    "schemas",
    "services",
    "shared",
    "prompts",
    "utils",
    "models",
]
[tool.setuptools.package-dir]
"langgraph.templates.agent" = "src/agent"
"agent" = "src/agent"
"ingestion" = "src/ingestion"
"schemas" = "src/schemas"
"services" = "src/services"
"shared" = "src/shared"
"prompts" = "src/prompts"
"utils" = "src/utils"
"models" = "src/models"
[tool.setuptools.package-data]
"*" = ["py.typed"]

[tool.ruff]
lint.select = [
    "E",    # pycodestyle
    "F",    # pyflakes
    "I",    # isort
    "D",    # pydocstyle
    "D401", # First line should be in imperative mood
    "T201",
    "UP",
]
lint.ignore = [
    "UP006",
    "UP007",
    # We actually do want to import from typing_extensions
    "UP035",
    # Relax the convention by _not_ requiring documentation for every function parameter.
    "D417",
    "E501",
]
[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D", "UP"]
# 模块/函数说明使用中文，首行不以英文句点结尾
"src/schemas/**/*.py" = ["D415"]
"src/services/**/*.py" = ["D415"]
"src/utils/**/*.py" = ["D415"]
"src/ingestion/**/*.py" = ["D415"]
"configs/**/*.py" = ["D415"]
[tool.ruff.lint.pydocstyle]
convention = "google"

[dependency-groups]
dev = [
    "anyio>=4.7.0",
    "langgraph-cli[inmem]>=0.4.14",
    "mypy>=1.13.0",
    "pytest>=8.3.5",
    "ruff>=0.8.2",
]
