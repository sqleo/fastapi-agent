version: '3.9'

services:
  # =============================================
  # FastAPI 业务服务（生产）
  # =============================================
  fastapi:
    image: ${FASTAPI_IMAGE:-ccr.ccs.tencentyun.com/sqliu/fastapi:latest}
    container_name: fastapi-app
    ports:
      - "8888:8888"
    env_file:
      - .env
    environment:
      - MYSQL_URL=mysql+aiomysql://${MYSQL_USER:-root}:${MYSQL_PASSWORD:-root}@${MYSQL_HOST:-mysql}:${MYSQL_PORT:-3306}/${MYSQL_DATABASE:-app_db}
      - MILVUS_URI=http://${MILVUS_HOST:-milvus}:${MILVUS_PORT:-19530}
      - LLAMAINDEX_POSTGRES_URI=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@${POSTGRES_HOST:-postgres}:${POSTGRES_PORT:-5432}/${POSTGRES_DB:-langgraph}
      - REDIS_URI=redis://redis:6379/1
      - POSTGRES_URI=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@${POSTGRES_HOST:-postgres}:${POSTGRES_PORT:-5432}/${POSTGRES_DB:-langgraph}
    volumes:
      # 可选；嵌入已走 DB 全局设置的 OpenAI 兼容 /embeddings（变量名沿用 BGE_MODEL_HOST_PATH）
      - ${BGE_MODEL_HOST_PATH:-./model}:/app/model:ro
      - app_static:/app/static
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      milvus:
        condition: service_healthy
    networks:
      - app-network

  # =============================================
  # Web 前端（Next.js，web_agent 项目构建镜像）
  # NEXT_PUBLIC_* 在 build 时写入 bundle，改 API 地址需重新 build+push 镜像
  # =============================================
  web:
    image: ${WEB_IMAGE:-ccr.ccs.tencentyun.com/sqliu/web_agent:latest}
    container_name: web-agent
    ports:
      - "${WEB_HOST_PORT:-3000}:3000"
    env_file:
      - path: .env_web
        required: false
    restart: unless-stopped
    depends_on:
      - fastapi
    networks:
      - app-network

  # =============================================
  # LlamaRAG 解析 Worker（生产，Taskiq，队列 llamarag:parse）
  # =============================================
  llamarag-parse-worker:
    image: ${FASTAPI_IMAGE:-ccr.ccs.tencentyun.com/sqliu/fastapi:latest}
    container_name: llamarag-parse-worker
    env_file:
      - .env
    environment:
      - PYTHONUNBUFFERED=1
      - MYSQL_URL=mysql+aiomysql://${MYSQL_USER:-root}:${MYSQL_PASSWORD:-root}@${MYSQL_HOST:-mysql}:${MYSQL_PORT:-3306}/${MYSQL_DATABASE:-app_db}
      - MILVUS_URI=http://${MILVUS_HOST:-milvus}:${MILVUS_PORT:-19530}
      - LLAMAINDEX_POSTGRES_URI=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@${POSTGRES_HOST:-postgres}:${POSTGRES_PORT:-5432}/${POSTGRES_DB:-langgraph}
      - REDIS_URI=redis://redis:6379/1
    command: taskiq worker llamarag.worker.taskiq_tasks:broker
    volumes:
      # 可选挂载（同上）；不再需要容器内 LLAMARAG_PROJECT_ROOT
      - ${BGE_MODEL_HOST_PATH:-./model}:/app/model:ro
      - app_static:/app/static
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      milvus:
        condition: service_healthy
    networks:
      - app-network

  # =============================================
  # LangMem reindex Worker（生产，Taskiq，队列 langmem:reindex）
  # =============================================
  langmem-reindex-worker:
    image: ${FASTAPI_IMAGE:-ccr.ccs.tencentyun.com/sqliu/fastapi:latest}
    container_name: langmem-reindex-worker
    env_file:
      - .env
    environment:
      - PYTHONUNBUFFERED=1
      - MYSQL_URL=mysql+aiomysql://${MYSQL_USER:-root}:${MYSQL_PASSWORD:-root}@${MYSQL_HOST:-mysql}:${MYSQL_PORT:-3306}/${MYSQL_DATABASE:-app_db}
      - POSTGRES_URI=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@${POSTGRES_HOST:-postgres}:${POSTGRES_PORT:-5432}/${POSTGRES_DB:-langgraph}
      - REDIS_URI=redis://redis:6379/1
    command: taskiq worker infra.langgraph.reindex_tasks:broker
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - app-network

  # =============================================
  # PostgreSQL（生产）
  # =============================================
  postgres:
    image: pgvector/pgvector:pg16-trixie
    container_name: langgraph-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-langgraph}
    ports:
      - "5432:5432"
    volumes:
      - pgdata_prod:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - app-network

  # =============================================
  # Redis（生产）
  # =============================================
  redis:
    image: redis:7-alpine
    container_name: langgraph-redis
    ports:
      - "6379:6379"
    volumes:
      - redisdata_prod:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - app-network

  # =============================================
  # MySQL（生产）
  # =============================================
  mysql:
    image: mysql:8.0
    container_name: app-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_PASSWORD:-root}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-app_db}
    ports:
      - "3306:3306"
    volumes:
      - mysqldata_prod:/var/lib/mysql
    command: --default-authentication-plugin=mysql_native_password --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - app-network

  # =============================================
  # Milvus 相关服务（生产）
  # =============================================
  etcd:
    image: quay.io/coreos/etcd:v3.5.18
    container_name: milvus-etcd
    environment:
      - ETCD_AUTO_COMPACTION_MODE=revision
      - ETCD_AUTO_COMPACTION_RETENTION=1000
      - ETCD_QUOTA_BACKEND_BYTES=4294967296
      - ETCD_SNAPSHOT_COUNT=50000
    volumes:
      - etcddata_prod:/etcd
    command: etcd -advertise-client-urls=http://127.0.0.1:2379 -listen-client-urls http://0.0.0.0:2379 --data-dir /etcd
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 30s
      timeout: 20s
      retries: 3
    restart: unless-stopped
    networks:
      - app-network

  minio:
    image: minio/minio:RELEASE.2023-03-20T20-16-18Z
    container_name: milvus-minio
    environment:
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
    ports:
      - "9001:9001"
      - "9000:9000"
    volumes:
      - miniodata_prod:/minio_data
    command: minio server /minio_data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
    restart: unless-stopped
    networks:
      - app-network

  # 升级前请备份 milvusdata_prod；2.4→2.5 见 https://milvus.io/docs/upgrade_milvus.md
  milvus:
    image: milvusdb/milvus:v2.5.27
    container_name: milvus-standalone
    command: milvus run standalone
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
    ports:
      - "19530:19530"
      - "9091:9091"
    volumes:
      - milvusdata_prod:/var/lib/milvus
    depends_on:
      etcd:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 30s
      timeout: 20s
      retries: 3
    restart: unless-stopped
    networks:
      - app-network

  # =============================================
  # Attu（可选）
  # =============================================
  attu:
    image: zilliz/attu:v2.5.12
    container_name: milvus-attu
    profiles:
      - attu
    ports:
      - "8000:3000"
    environment:
      MILVUS_URL: milvus:19530
    depends_on:
      milvus:
        condition: service_healthy
    networks:
      - app-network

volumes:
  app_static:
  pgdata_prod:
  redisdata_prod:
  mysqldata_prod:
  etcddata_prod:
  miniodata_prod:
  milvusdata_prod:

networks:
  app-network:
    driver: bridge
