# Nginx 反向代理配置
# 用于生产环境：统一入口，路由 API 和 Web 请求

upstream fastapi_backend {
    # FastAPI 服务，支持多实例负载均衡
    server fastapi:8888 max_fails=3 fail_timeout=10s;
    keepalive 32;
}

upstream web_backend {
    # Next.js 前端服务
    server web:3000 max_fails=3 fail_timeout=10s;
    keepalive 32;
}

server {
    listen 80;
    server_name _;
    client_max_body_size 100M;
    
    # 日志配置
    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log warn;

    # =============================================
    # API 路由 → FastAPI
    # =============================================
    location /api/ {
        proxy_pass http://fastapi_backend;
        proxy_http_version 1.1;
        
        # 连接保活（长连接）
        proxy_set_header Connection "upgrade";
        proxy_set_header Upgrade $http_upgrade;
        
        # 传递原始请求头
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # 超时配置
        proxy_connect_timeout 10s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        
        # 缓冲配置
        proxy_buffering off;
    }

    # =============================================
    # /v1/* 也路由到 FastAPI（FastAPI 的实际 API 前缀）
    # =============================================
    location /v1/ {
        proxy_pass http://fastapi_backend;
        proxy_http_version 1.1;
        
        proxy_set_header Connection "upgrade";
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        proxy_connect_timeout 10s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        proxy_buffering off;
    }

    # =============================================
    # WebSocket 支持（如果 FastAPI 有 WebSocket）
    # =============================================
    location /ws/ {
        proxy_pass http://fastapi_backend;
        proxy_http_version 1.1;
        
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # WebSocket 无超时
        proxy_read_timeout 86400;
        proxy_buffering off;
    }

    # =============================================
    # FastAPI 文档 → /docs, /redoc, /openapi.json
    # =============================================
    location ~ ^/(docs|redoc|openapi\.json) {
        proxy_pass http://fastapi_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # =============================================
    # 根路由和其他所有请求 → Next.js Web
    # =============================================
    location / {
        proxy_pass http://web_backend;
        proxy_http_version 1.1;
        
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        proxy_connect_timeout 10s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # =============================================
    # 健康检查端点（可选）
    # =============================================
    location /health {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }
}

